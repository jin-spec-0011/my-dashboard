name: Frame Heartbeat (액자 끊김 감시)

# 15분마다 액자 하트비트 확인 → 30분 이상 끊긴 기기를 진세·지혜 폰에 Web Push로 알림
# - 수동 실행에서 test=true 면 모든 구독에 테스트 알림 1회
# - GitHub 예약 실행은 수~수십 분 지연될 수 있음
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 알림 보내기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frame-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/scripts/frame_heartbeat_requirements.txt

      - name: 의존성 설치
        run: pip install --quiet --disable-pip-version-check -r .github/scripts/frame_heartbeat_requirements.txt

      - name: 끊김 확인·알림
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ inputs.test || false }}
        run: python .github/scripts/frame_heartbeat.py
